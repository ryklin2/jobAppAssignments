[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-assessment"
version = "0.1.0"
description = "Producer-consumer synchronization and sales analytics assignments"
requires-python = ">=3.10"
dependencies = []  # standard library only

[tool.setuptools]
packages = ["producer_consumer", "sales_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets plain `pytest` import the packages, not only `python -m pytest`
timeout = 10         # pytest-timeout: a deadlocked test fails instead of hanging
addopts = "-ra"      # list every skip/xfail reason in the summary

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["producer_consumer", "sales_analytics"]

[tool.coverage.run]
source = ["producer_consumer", "sales_analytics"]
branch = true
